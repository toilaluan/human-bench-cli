[project]
name = "human-bench"
version = "0.1.0"
description = "Reproducible human-centric evaluation of text-to-image generations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "filelock>=3.16",
    "numpy>=2.0",
    "openai>=1.75",
    "pillow>=11.0",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "typer>=0.15",
]

[project.optional-dependencies]
review = ["gradio>=5.0"]
embedding = ["sentence-transformers>=6.1.0", "transformers>=5.18.0"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.11", "httpx>=0.28", "build>=1.2"]

[project.scripts]
human-bench = "human_bench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/human_bench"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
